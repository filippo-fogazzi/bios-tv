name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk bios-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bios-tv
          path: bios-tv.apk

      # Fixed download link for the TV:
      # https://github.com/<utente>/<repo>/releases/latest/download/bios-tv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BIOS TV ${{ github.run_number }}
          files: bios-tv.apk
          make_latest: true
