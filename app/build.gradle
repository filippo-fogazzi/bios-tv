plugins {
    id 'com.android.application'
}

android {
    namespace 'it.filippo.biostv'
    compileSdk 34

    defaultConfig {
        applicationId 'it.filippo.biostv'
        minSdk 24
        targetSdk 34
        // CI passes the run number so every build installs as an update.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // Fixed key so each new APK installs over the previous one without uninstalling.
        bios {
            storeFile file('keystore/biostv.jks')
            storePassword 'biostv-launcher'
            keyAlias 'biostv'
            keyPassword 'biostv-launcher'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.bios
        }
        debug {
            signingConfig signingConfigs.bios
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
